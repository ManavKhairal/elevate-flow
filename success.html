<!DOCTYPE html>

<body class="min-h-screen flex items-center justify-center relative">
    <div class="text-center p-8 bg-[#101726] border border-blue-600/30 rounded-xl shadow-2xl max-w-lg mx-auto">
        <div class="w-20 h-20 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
