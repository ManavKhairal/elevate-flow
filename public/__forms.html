<!DOCTYPE html>
<html>
  <head>
    <title>Netlify Forms Cache</title>
  </head>
  <body>
    <!-- This hidden form ensures Netlify's build bots register the form fields for Next.js -->
    <form name="consultation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="workEmail" />
      <input type="text" name="industry" />
      <textarea name="bottleneck"></textarea>
    </form>
  </body>
</html>
